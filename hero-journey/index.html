    <script>
        (function() {
            try {
                var isLight = false;
                var raw = localStorage.getItem('oreCalc_appSettings') || localStorage.getItem('orecalc_state');
                if (raw) {
                    var parsed = JSON.parse(raw);
                    isLight = (parsed && (parsed.theme === 'light' || (parsed.settings && parsed.settings.theme === 'light')));
                    var accent = parsed.accentColor || (parsed.settings && parsed.settings.accentColor);
                    if (accent) {
                        document.documentElement.setAttribute('data-accent', accent);
                    }
                }
                if (isLight) {
                    document.documentElement.classList.add('light-mode');
                } else {
                    document.documentElement.classList.add('dark-mode');
                }
            } catch (e) {}
        })();
    </script>
