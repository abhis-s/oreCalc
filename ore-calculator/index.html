    <script>
        (function() {
            try {
                var tagParam = (window.location.search.match(/[?&](?:tag|p|player)=([^&]+)/) || [])[1];
                var rawTags = localStorage.getItem('clashCalc_playerTags') || localStorage.getItem('oreCalc_playerTags');
                var activeTag = null;
                if (tagParam) {
                    activeTag = decodeURIComponent(tagParam).replace(/^#/, '').toUpperCase();
                } else if (rawTags) {
                    var parsedTags = JSON.parse(rawTags);
                    if (Array.isArray(parsedTags) && parsedTags.length > 0 && parsedTags[0] !== 'DEFAULT0') {
                        activeTag = parsedTags[0].replace(/^#/, '').toUpperCase();
                    }
                }

                if (activeTag) {
                    var rawPlayer = localStorage.getItem('clashCalc_player_' + activeTag) || localStorage.getItem('oreCalc_player_' + activeTag);
                    if (rawPlayer) {
                        try {
                            var parsedPlayer = JSON.parse(rawPlayer);
                            var profile = parsedPlayer ? parsedPlayer.playerProfile : null;
                            if (profile) {
                                var nameEl = document.getElementById('selected-player-name');
                                if (nameEl && profile.name) nameEl.textContent = profile.name;

                                var cardNameEl = document.getElementById('home-profile-player-name');
                                if (cardNameEl && profile.name) cardNameEl.textContent = profile.name;

                                var cardTagEl = document.getElementById('home-profile-player-tag');
                                if (cardTagEl) cardTagEl.textContent = '#' + activeTag.replace(/^#+/, '');

                                var thLevel = profile.townHallLevel || 19;
                                var thImgEl = document.getElementById('home-profile-th-badge-img');
                                if (thImgEl) {
                                    thImgEl.setAttribute('src', '/assets/th/th' + thLevel + '.png');
                                    thImgEl.setAttribute('alt', 'Town Hall ' + thLevel);
                                }
                                var thLevelEl = document.getElementById('home-profile-th-badge-level');
                                if (thLevelEl) thLevelEl.textContent = thLevel;

                                if (profile.clan && profile.clan.name) {
                                    var clanNameEl = document.getElementById('home-profile-clan-name');
                                    if (clanNameEl) clanNameEl.textContent = profile.clan.name;
                                    var clanBadgeEl = document.getElementById('home-profile-clan-badge');
                                    var badgeUrl = profile.clan.badgeUrls ? profile.clan.badgeUrls.small : (profile.clanBadgeUrl || '');
                                    if (clanBadgeEl && badgeUrl) {
                                        clanBadgeEl.setAttribute('src', badgeUrl);
                                        clanBadgeEl.removeAttribute('hidden');
                                        clanBadgeEl.hidden = false;
                                    }
                                }

                                var trophiesEl = document.getElementById('home-profile-trophies');
                                if (trophiesEl && profile.trophies !== undefined) {
                                    trophiesEl.textContent = Number(profile.trophies).toLocaleString();
                                }

                                var leagueBadgeEl = document.getElementById('home-profile-league-badge');
                                var leagueIcon = profile.leagueTier && profile.leagueTier.iconUrls ? profile.leagueTier.iconUrls.small : null;
                                if (leagueBadgeEl && leagueIcon) {
                                    leagueBadgeEl.setAttribute('src', leagueIcon);
                                }
                                var leagueNameEl = document.getElementById('home-profile-league-name');
                                var leagueName = profile.leagueTier ? profile.leagueTier.name : (profile.league ? profile.league.name : null);
                                if (leagueNameEl && leagueName) {
                                    leagueNameEl.textContent = leagueName;
                                }

                                var cardEl = document.getElementById('orecalc-home-player-card');
                                if (cardEl) {
                                    cardEl.classList.remove('is-skeleton');
                                    cardEl.removeAttribute('hidden');
                                    cardEl.hidden = false;
                                }
                            }
                        } catch (e) {}
                    }
                }

                var hash = window.location.hash;
                if (hash && hash.length > 1) {
                    var tabName = hash.substring(1).replace(/-tab$/, '');
                    var validTabs = ['home', 'equipment', 'income', 'planner'];
                    if (validTabs.indexOf(tabName) !== -1 && tabName !== 'home') {
                        var homeTab = document.getElementById('home-tab');
                        var targetTab = document.getElementById(tabName + '-tab');
                        if (homeTab && targetTab) {
                            homeTab.classList.remove('is-active');
                            targetTab.classList.add('is-active');
                            var navTabs = document.querySelectorAll('.app-header__tab');
                            for (var i = 0; i < navTabs.length; i++) {
                                var t = navTabs[i];
                                if (t.getAttribute('data-tab') === tabName) {
                                    t.classList.add('is-active');
                                    t.setAttribute('aria-selected', 'true');
                                } else {
                                    t.classList.remove('is-active');
                                    t.setAttribute('aria-selected', 'false');
                                }
                            }
                        }
                    }
                }
            } catch (_) {}
        })();
    </script>
