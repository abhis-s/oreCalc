    <script>
        (function() {
            try {
                var s = JSON.parse(localStorage.getItem('oreCalc_appSettings') || '{}');
                var isLight = (s.theme === 'light');
                var bg = isLight ? '#f8f9fa' : '#121212';
                var m = document.querySelector('meta[name="theme-color"]:not([media])');
                if (m) m.setAttribute('content', bg);
                document.documentElement.style.backgroundColor = bg;
                document.documentElement.style.colorScheme = isLight ? 'light' : 'dark';
                if (isLight) {
                    document.documentElement.classList.add('light-mode');
                } else {
                    document.documentElement.classList.add('dark-mode');
                }
                if (/[?&]tag=/.test(window.location.search) || localStorage.getItem('clashCalc_activePlayerTag') || localStorage.getItem('oreCalc_activePlayerTag') || localStorage.getItem('orecalc_activePlayerTag')) {
                    document.documentElement.classList.add('has-player');
                }
            } catch (e) {}
        })();
    </script>

    <div id="preloader" hidden>
        <script>
            (function () {
                var accent = 'blue';
                var isLight = false;
                try {
                    var settingsStr = localStorage.getItem('oreCalc_appSettings');
                    if (settingsStr) {
                        var parsed = JSON.parse(settingsStr);
                        if (parsed) {
                            if (parsed.accentColor) accent = parsed.accentColor;
                            if (parsed.theme === 'light') isLight = true;
                        }
                    }
                } catch (e) {}
                if (accent === 'random') {
                    var accents = ['blue', 'gold', 'purple', 'green', 'red'];
                    accent = accents[Math.floor(Math.random() * accents.length)];
                    window.sessionRandomAccent = accent;
                }
                var preloader = document.getElementById('preloader');
                preloader.setAttribute('data-accent', accent);
                preloader.setAttribute('data-theme', isLight ? 'light' : 'dark');
            })();
        </script>
        <div class="preloader-loader">
