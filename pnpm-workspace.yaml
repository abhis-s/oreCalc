packages:
  - '.'
  - 'server'

allowBuilds:
  '@firebase/util': true
  '@parcel/watcher': true
  'core-js': true
  'esbuild': true
  'fsevents': true
  'protobufjs': true
  'sharp': true
  'workerd': true

minimumReleaseAgeExclude:
  - '@crowdin/cli-darwin-arm64@5.6.0'
  - '@crowdin/cli-darwin-x64@5.6.0'
  - '@crowdin/cli-linux-arm64-musl@5.6.0'
  - '@crowdin/cli-linux-arm64@5.6.0'
  - '@crowdin/cli-linux-x64-musl@5.6.0'
  - '@crowdin/cli-linux-x64@5.6.0'
  - '@crowdin/cli-win32-arm64@5.6.0'
  - '@crowdin/cli-win32-x64@5.6.0'
  - '@crowdin/cli@5.6.0'
