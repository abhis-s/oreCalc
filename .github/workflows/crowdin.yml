name: Crowdin Sync

on:
  push:
    branches: [ main, feat/crowdin-sync, crowdin-sync ]
    paths:
      - 'js/i18n/en.json'
      - 'crowdin.yml'
      - '.github/workflows/crowdin.yml'
  schedule:
    - cron: '0 0 * * *' # Daily sync check at midnight UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  synchronize-with-crowdin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Synchronize with Crowdin
        uses: crowdin/github-action@v2
        with:
          upload_sources: true
          upload_translations: false
          download_translations: true
          create_pull_request: true
          pull_request_title: 'i18n: Update translations from Crowdin'
          pull_request_body: 'Automated pull request with latest translations from Crowdin.'
          localization_branch_name: 'crowdin-translations'
          commit_message: 'i18n: sync translations from Crowdin [skip ci]'
          pull_request_labels: 'i18n, crowdin'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID || secrets.PROJECT_ID || secrets.CROWDIN_PROJECT }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN || secrets.PAM || secrets.CROWDIN_PAM || secrets.CROWDIN_PAT || secrets.PERSONAL_ACCESS_TOKEN }}

