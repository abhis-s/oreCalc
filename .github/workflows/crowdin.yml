name: Crowdin Sync

on:
  push:
    branches: [ main, feat/crowdin-sync, crowdin-sync ]
    paths:
      - 'js/i18n/en.json'
      - 'crowdin.yml'
      - '.github/workflows/crowdin.yml'
  schedule:
    - cron: '0 0 * * *' # Daily sync check at midnight UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  synchronize-with-crowdin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload Source Strings to Crowdin
        uses: crowdin/github-action@v2
        with:
          upload_sources: true
          upload_translations: false
          download_translations: false
          create_pull_request: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID || secrets.PROJECT_ID || secrets.CROWDIN_PROJECT }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN || secrets.PAM || secrets.CROWDIN_PAM || secrets.CROWDIN_PAT || secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download & Prune Eligible Translations
        run: |
          npm install -g @crowdin/cli
          node scripts/crowdin-download.js
          node scripts/validate-i18n.js
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID || secrets.PROJECT_ID || secrets.CROWDIN_PROJECT }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN || secrets.PAM || secrets.CROWDIN_PAM || secrets.CROWDIN_PAT || secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'i18n: sync translations from Crowdin [skip ci]'
          title: 'i18n: Update translations from Crowdin'
          body: 'Automated pull request with latest verified translations from Crowdin.'
          branch: 'crowdin-translations'
          base: 'main'
          labels: 'i18n, crowdin'

