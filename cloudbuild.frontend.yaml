steps:
- name: 'gcr.io/cloud-builders/docker'
  args:
  - 'build'
  - '--no-cache'
  - '-t'
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/orecalc/clashcalc-webapp:$COMMIT_SHA'
  - '.'
  - '-f'
  - 'Dockerfile'
  id: Build

- name: 'gcr.io/cloud-builders/docker'
  args:
  - 'push'
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/orecalc/clashcalc-webapp:$COMMIT_SHA'
  id: Push

- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  entrypoint: gcloud
  args:
  - 'run'
  - 'services'
  - 'update'
  - 'clashcalc-webapp'
  - '--platform=managed'
  - '--image=europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/orecalc/clashcalc-webapp:$COMMIT_SHA'
  - '--region=europe-west1'
  - '--quiet'
  id: Deploy

images:
- 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/orecalc/clashcalc-webapp:$COMMIT_SHA'

options:
  machineType: 'E2_STANDARD_2'
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE
