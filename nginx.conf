server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html index.htm;
    absolute_redirect off;

    # Suppress Nginx server version fingerprint
    server_tokens off;

    # Security & HSTS Headers (Server Defaults)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Media Images & Fonts Cache Control (1 year immutable for icons, equipment assets, and fonts)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|avif|webp|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Rewrite language-prefixed static asset requests (/de/assets/..., /de/js/..., /de/css/...) to root assets
    location ~ ^/(de|tr)/(assets|js|css|partials|licenses)/ {
        rewrite ^/(de|tr)/(.*)$ /$2 last;
    }

    # 301 Redirect /en/ to root /
    location = /en { return 301 /; }
    location = /en/ { return 301 /; }
    location = /en/privacy { return 301 /privacy; }
    location = /en/terms { return 301 /terms; }
    location = /en/licenses { return 301 /licenses; }

    # 301 Redirects for legacy legal URLs
    location = /privacy.html { return 301 /privacy; }
    location = /privacy/de { return 301 /de/privacy; }
    location = /privacy/de/ { return 301 /de/privacy; }

    location = /terms.html { return 301 /terms; }
    location = /terms/de { return 301 /de/terms; }
    location = /terms/de/ { return 301 /de/terms; }

    location = /licenses.html { return 301 /licenses; }

    # HTML Documents (no-cache, no-store, must-revalidate)
    location /de/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /de/index.html;
    }

    location /tr/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /tr/index.html;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri.html $uri $uri/ /index.html;
    }

    error_page 404 /404.html;
    location = /404.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        internal;
    }
}
