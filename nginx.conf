server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html index.htm;
    absolute_redirect off;

    # --- 1. Server Defaults & Security Headers ---
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- 2. Static Asset Caching & Rewrites ---
    location ~* \.(png|jpg|jpeg|gif|ico|svg|avif|webp|woff2?)$ {
        add_header Cache-Control "public, max-age=15552000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~ ^/(de|tr|zh)/(assets|js|css|partials|licenses|legal)/ {
        rewrite ^/(de|tr|zh)/(.*)$ /$2 last;
    }

    # --- 3. Route Redirects ---
    location = /en { return 301 /; }
    location = /en/ { return 301 /; }
    location = /en/privacy { return 301 /privacy/; }
    location = /en/privacy/ { return 301 /privacy/; }
    location = /en/terms { return 301 /terms/; }
    location = /en/terms/ { return 301 /terms/; }
    location = /en/licenses { return 301 /licenses/; }
    location = /en/licenses/ { return 301 /licenses/; }

    location = /privacy { return 301 /privacy/; }
    location = /privacy.html { return 301 /privacy/; }
    location = /privacy/de { return 301 /de/privacy/; }
    location = /privacy/de/ { return 301 /de/privacy/; }

    location = /terms { return 301 /terms/; }
    location = /terms.html { return 301 /terms/; }
    location = /terms/de { return 301 /de/terms/; }
    location = /terms/de/ { return 301 /de/terms/; }

    location = /licenses { return 301 /licenses/; }
    location = /licenses.html { return 301 /licenses/; }
    location = /de/licenses { return 301 /licenses/; }
    location = /de/licenses/ { return 301 /licenses/; }

    location = /ore-calculator { return 301 /ore-calculator/; }
    location = /hero-journey { return 301 /hero-journey/; }

    location = /de/ore-calculator { return 301 /de/ore-calculator/; }
    location = /de/hero-journey { return 301 /de/hero-journey/; }

    location = /tr/ore-calculator { return 301 /tr/ore-calculator/; }
    location = /tr/hero-journey { return 301 /tr/hero-journey/; }

    location = /zh/ore-calculator { return 301 /zh/ore-calculator/; }
    location = /zh/hero-journey { return 301 /zh/hero-journey/; }

    # --- 4. HTML Document Routing & Cache Control ---
    location = /de { return 301 /de/; }
    location = /tr { return 301 /tr/; }
    location = /zh { return 301 /zh/; }

    location = / {
        if ($host ~* "clashcalc\.com") {
            return 301 /ore-calculator/;
        }
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /index.html =404;
    }

    location = /de/ {
        if ($host ~* "clashcalc\.com") {
            return 301 /de/ore-calculator/;
        }
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /de/index.html =404;
    }

    location = /tr/ {
        if ($host ~* "clashcalc\.com") {
            return 301 /tr/ore-calculator/;
        }
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /tr/index.html =404;
    }

    location = /zh/ {
        if ($host ~* "clashcalc\.com") {
            return 301 /zh/ore-calculator/;
        }
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /zh/index.html =404;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri.html $uri $uri/ =404;
    }

    # --- 5. Error Handling ---
    error_page 404 /404.html;
    location = /404.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        internal;
    }
}
