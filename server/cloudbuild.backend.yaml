steps:
- name: 'gcr.io/cloud-builders/docker'
  args:
  - 'build'
  - '--no-cache'
  - '-t'
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/orecalc/clashcalc-api:$COMMIT_SHA'
  - '.'
  - '-f'
  - 'Dockerfile'
  dir: 'server'
  id: Build

- name: 'gcr.io/cloud-builders/docker'
  args:
  - 'push'
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/orecalc/clashcalc-api:$COMMIT_SHA'
  id: Push

- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  entrypoint: gcloud
  args:
  - 'run'
  - 'services'
  - 'update'
  - 'clashcalc-api'
  - '--platform=managed'
  - '--image=europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/orecalc/clashcalc-api:$COMMIT_SHA'
  - '--region=europe-west1'
  - '--quiet'
  - '--update-secrets=CLASH_OF_CLANS_API_TOKEN=clash-of-clans-api-token:latest,FIRESTORE_SA_KEY=orecalc-firestore-sa-key:latest,SMTP_PASS=smtp-password:latest,JWT_SECRET=jwt-secret:latest,TURNSTILE_SECRET_KEY=turnstile-secret-key:latest'
  - '--update-env-vars=SMTP_HOST=smtp.zoho.eu,SMTP_PORT=465,SMTP_SECURE=true,SMTP_USER=admin@clashcalc.com,EMAIL_FROM=noreply@clashcalc.com,RECIPIENT_EMAIL_LEGAL=legal@clashcalc.com,RECIPIENT_EMAIL_SUPPORT=support@clashcalc.com,RECIPIENT_EMAIL_SECURITY=security@clashcalc.com,RECIPIENT_EMAIL_ALERTS=alerts@clashcalc.com,RP_NAME=ClashCalc,RP_ID=clashcalc.com,RP_ORIGIN=https://clashcalc.com,TURNSTILE_ENABLED=true,TURNSTILE_SITE_KEY=0x4AAAAAAFKe1o6aVU7iEWw7'
  id: Deploy

images:
- 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/orecalc/clashcalc-api:$COMMIT_SHA'

options:
  machineType: 'E2_STANDARD_2'
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE
