<dialog id="migrated-blocker-modal" class="modal migrated-blocker-modal" aria-labelledby="migrated-blocker-title" aria-describedby="migrated-blocker-desc">
    <div class="modal-content">
        <div class="modal-header migrated-blocker-header">
            <div class="migrated-blocker-icon-container" aria-hidden="true">
                <orecalc-assets-svg name="cloud-lock" class="migrated-blocker-icon"></orecalc-assets-svg>
            </div>
            <h2 id="migrated-blocker-title" data-i18n="views.migrationBlocker.title"></h2>
        </div>
        <div class="modal-body">
            <p id="migrated-blocker-desc" class="migrated-blocker-description" data-i18n="views.migrationBlocker.description"></p>

                <p id="migrated-blocker-notice" data-i18n="views.migrationBlocker.infoNotice"></p>
            </div>
        </div>
        <div class="modal-actions modal-actions-stretch migrated-blocker-actions">
            <button type="button" id="migrated-blocker-reset-btn" class="reject-button button-outlined" data-i18n="views.migrationBlocker.resetAction"></button>
