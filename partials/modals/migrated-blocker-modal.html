<dialog id="migrated-blocker-modal" class="modal migrated-blocker-modal" aria-labelledby="migrated-blocker-title" aria-describedby="migrated-blocker-desc">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="migrated-blocker-title" data-i18n="views.migrationBlocker.title"></h2>
        </div>
        <div class="modal-body">
            <div class="migrated-blocker-icon-container">
                <orecalc-assets-svg name="cloud-lock" class="migrated-blocker-icon"></orecalc-assets-svg>
            </div>
            <p id="migrated-blocker-desc" class="migrated-blocker-description" data-i18n="views.migrationBlocker.description"></p>
            <div class="migrated-blocker-notice-card">

        <div class="modal-actions migrated-blocker-actions">
