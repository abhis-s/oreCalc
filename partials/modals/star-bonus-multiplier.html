<dialog id="star-bonus-multiplier-modal" class="modal" aria-labelledby="star-bonus-multiplier-modal-title">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="star-bonus-multiplier-modal-title" data-i18n="views.income.starBonusMultiplier.title"></h2>
            <button id="close-star-bonus-multiplier-modal-btn" class="close-button" data-i18n-aria-label="actions.close">
                <orecalc-assets-svg name="close"></orecalc-assets-svg>
            </button>
        </div>
        <div class="modal-body">
            <div class="settings-info-box margin-bottom-20">
                <h3 data-i18n="views.income.starBonus.section2x"></h3>

                <div class="input-group-flex push-top-5">
                    <div class="field-descriptor-group">
                        <label for="inc-star-bonus-2x-frequency-input" data-i18n="views.income.starBonus.eventFrequency"></label>
                        <p class="form-setting-text" data-i18n="views.income.starBonus.eventFrequencyInfo"></p>
                    </div>
                    <div class="popover-wrapper">
                        <input type="number" id="inc-star-bonus-2x-frequency-input" class="updatable" min="1" max="4" value="2" maxlength="1" data-modal-autofocus>
                    </div>
                </div>

                <div class="input-group-flex push-top-5">
                    <div class="field-descriptor-group">
                        <label for="inc-star-bonus-2x-duration-input" data-i18n="views.income.starBonus.eventDuration"></label>
                        <p class="form-setting-text" data-i18n="views.income.starBonus.eventDurationInfo"></p>
                    </div>
                    <div class="popover-wrapper">
                        <input type="number" id="inc-star-bonus-2x-duration-input" class="updatable" min="0" max="7" value="5" maxlength="1">
                    </div>
                </div>

                <div class="input-group-flex push-top-5">
                    <div class="field-descriptor-group">
                        <label for="inc-star-bonus-2x-last-event-select" data-i18n="views.income.starBonus.lastEvent"></label>
                        <p class="form-setting-text" data-i18n="views.income.starBonus.lastEventInfo"></p>
                    </div>
                    <select id="inc-star-bonus-2x-last-event-select" class="dropdown-style updatable">
                        <!-- DYNAMIC INSERTION: Star bonus last event select options -->
                    </select>
                </div>
            </div>

            <div class="separator"></div>

            <div id="star-bonus-4x-section" class="settings-info-box">
                <h3 data-i18n="views.income.starBonus.event4x"></h3>
                <div id="th-planning-section" class="flex-column-gap-10">
                    <!-- DYNAMIC INSERTION: Town Hall star bonus 4x planning rows -->
                </div>
            </div>
        </div>
        <div class="modal-actions">
            <button id="close-star-bonus-multiplier-footer-btn" class="reject-button" data-i18n="actions.ok"></button>
        </div>
    </div>
</dialog>
