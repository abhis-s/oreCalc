<dialog id="global-pricing-modal" class="modal" aria-labelledby="global-pricing-modal-title">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="global-pricing-modal-title" data-i18n="views.settings.options.globalPricing"></h2>
            <button type="button" id="close-global-pricing-modal-btn" class="close-button" data-i18n-aria-label="actions.close">
                <orecalc-assets-svg name="close"></orecalc-assets-svg>
            </button>
        </div>
        <div class="modal-body">
            <div class="modal-info-text">
                <p data-i18n="views.settings.globalPricing.desc"></p>
            </div>
            <div class="input-group-flex margin-bottom-20">
                <label for="global-pricing-currency-select" data-i18n="views.settings.globalPricing.modal.selectCurrency"></label>
                <select id="global-pricing-currency-select" class="dropdown-style" data-modal-autofocus>
                    <!-- DYNAMIC INSERTION: Currency select options -->
                </select>
            </div>

            <div class="global-pricing-grid-container">
                <div class="global-pricing-grid-header">
                    <span data-i18n="views.settings.globalPricing.modal.offerTierHeader"></span>
                    <span id="global-pricing-custom-header" data-i18n="views.settings.globalPricing.modal.customHeader"></span>
                </div>
                <div id="global-pricing-grid-body" class="global-pricing-grid-body">
                    <!-- DYNAMIC INSERTION: Pricing comparison grid rows -->
                </div>
            </div>
        </div>
        <div class="modal-actions">
            <button type="button" id="reset-global-pricing-btn" class="btn-secondary modal-reset-btn" data-i18n="actions.reset" hidden></button>
            <button type="button" id="cancel-global-pricing-btn" class="btn-secondary" data-i18n="actions.cancel"></button>
            <button type="button" id="save-global-pricing-btn" class="btn-primary" data-i18n="actions.save"></button>
        </div>

    </div>
</dialog>
