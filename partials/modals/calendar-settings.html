<dialog id="calendar-settings-modal" class="modal" aria-labelledby="calendar-settings-modal-title">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="calendar-settings-modal-title" data-i18n="views.planner.settingsModal.title"></h2>
            <button id="close-calendar-settings-modal-btn" class="close-button" data-i18n-aria-label="actions.close">
                <orecalc-assets-svg name="close"></orecalc-assets-svg>
            </button>
        </div>
        <div class="modal-body flex-column-gap-15">
            <div class="input-group-flex">
                <div class="field-descriptor-group">
                    <label for="calendar-first-day-select" data-i18n="views.planner.settingsModal.firstDayOfWeek"></label>
                    <p class="form-setting-text" data-i18n="views.planner.settingsModal.firstDayOfWeekDesc"></p>
                </div>
                <select id="calendar-first-day-select" class="dropdown-style" data-modal-autofocus>
                    <option value="auto" data-i18n="views.planner.settingsModal.auto"></option>
                    <option value="monday" data-i18n="views.planner.settingsModal.monday"></option>
                    <option value="tuesday" data-i18n="views.planner.settingsModal.tuesday"></option>
                    <option value="friday" data-i18n="views.planner.settingsModal.friday"></option>
                    <option value="saturday" data-i18n="views.planner.settingsModal.saturday"></option>
                    <option value="sunday" data-i18n="views.planner.settingsModal.sunday"></option>
                </select>
            </div>

            <div class="input-group-flex">
                <div class="field-descriptor-group">
                    <label for="calendar-auto-place-scope-select" data-i18n="views.planner.settingsModal.autoPlaceScope"></label>
                    <p class="form-setting-text" data-i18n="views.planner.settingsModal.autoPlaceScopeDesc"></p>
                </div>
                <select id="calendar-auto-place-scope-select" class="dropdown-style">
                    <option value="month" data-i18n="views.planner.settingsModal.currentMonth"></option>
                    <option value="tillEnd" data-i18n="views.planner.settingsModal.tillEnd"></option>
                </select>
            </div>

            <div class="input-group-flex">
                <div class="field-descriptor-group">
                    <label for="calendar-show-icons-switch" data-i18n="views.planner.settingsModal.showChipIcons"></label>
                    <p class="form-setting-text" data-i18n="views.planner.settingsModal.showChipIconsDesc"></p>
                </div>
                <div class="switch">
                    <input type="checkbox" id="calendar-show-icons-switch">
                    <span class="slider round"></span>
                </div>
            </div>

            <div class="input-group-flex">
                <div class="field-descriptor-group">
                    <label for="calendar-show-equipment-milestones-switch" data-i18n="views.planner.settingsModal.showEquipmentMilestones"></label>
                    <p class="form-setting-text" data-i18n="views.planner.settingsModal.showEquipmentMilestonesDesc"></p>
                </div>
                <div class="switch">
                    <input type="checkbox" id="calendar-show-equipment-milestones-switch">
                    <span class="slider round"></span>
                </div>
            </div>

            <div class="input-group-flex">
                <div class="field-descriptor-group">
                    <label for="calendar-highlight-upgrade-ranges-switch" data-i18n="views.planner.settingsModal.highlightUpgradeRanges"></label>
                    <p class="form-setting-text" data-i18n="views.planner.settingsModal.highlightUpgradeRangesDesc"></p>
                </div>
                <div class="switch">
                    <input type="checkbox" id="calendar-highlight-upgrade-ranges-switch">
                    <span class="slider round"></span>
                </div>
            </div>
        </div>
        <div class="modal-actions">
            <button id="cancel-calendar-settings-btn" class="reject-button" data-i18n="actions.cancel"></button>
            <button id="save-calendar-settings-btn" class="accept-button" data-i18n="actions.save"></button>
        </div>
    </div>
</dialog>
