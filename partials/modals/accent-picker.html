<dialog id="accent-picker-modal" class="modal" aria-labelledby="accent-picker-modal-title">
    <div class="modal-content accent-picker-modal-content">
        <div class="modal-header">
            <h2 id="accent-picker-modal-title" data-i18n="views.settings.options.accentColor"></h2>
            <button id="close-accent-picker-btn" class="close-button" data-i18n-aria-label="actions.close">
                <orecalc-assets-svg name="close"></orecalc-assets-svg>
            </button>
        </div>
        <div class="modal-body">
            <div class="mobile-accent-grid">
                <button class="mobile-accent-swatch" data-color="blue" data-i18n-aria-label="colors.blue" data-modal-autofocus></button>
                <button class="mobile-accent-swatch" data-color="gold" data-i18n-aria-label="colors.gold"></button>
                <button class="mobile-accent-swatch" data-color="purple" data-i18n-aria-label="colors.purple"></button>
                <button class="mobile-accent-swatch" data-color="green" data-i18n-aria-label="colors.green"></button>
                <button class="mobile-accent-swatch" data-color="red" data-i18n-aria-label="colors.red"></button>
                <button class="mobile-accent-swatch" data-color="random" data-i18n-aria-label="colors.random" title="Random"></button>
            </div>
        </div>
    </div>
</dialog>
