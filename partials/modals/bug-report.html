<dialog id="bug-report-modal" class="modal support-modal" aria-labelledby="support-modal-title">
    <div class="modal-content support-modal-content">
        <div class="modal-header">
            <h2 id="support-modal-title" data-i18n="views.settings.bugReport.title"></h2>
            <button type="button" id="close-support-header-btn" class="close-button" data-i18n-aria-label="actions.close">
                <clashcalc-assets-svg name="close"></clashcalc-assets-svg>
            </button>
        </div>
        <div class="support-modal-tabs segmented-control">
            <button type="button" id="support-tab-bug" class="segmented-btn active" data-support-mode="bug" aria-selected="true">
                <clashcalc-assets-svg name="bug"></clashcalc-assets-svg>
                <span data-i18n="views.settings.bugReport.title"></span>
            </button>
            <button type="button" id="support-tab-feedback" class="segmented-btn" data-support-mode="feedback" aria-selected="false">
                <clashcalc-assets-svg name="feedback"></clashcalc-assets-svg>
                <span data-i18n="views.settings.feedback.title"></span>
            </button>
        </div>
        <div class="modal-info-text text-left">
            <p id="support-modal-info-bug" data-i18n="views.settings.bugReport.info"></p>
            <p id="support-modal-info-feedback" data-i18n="views.settings.feedback.info" hidden></p>
        </div>
        <div class="support-modal-form flex-column-gap-15 text-left">
            <div class="form-group flex-column-gap-5">
                <label for="support-email" class="input-label" data-i18n="views.settings.options.contactEmail"></label>
                <input type="email" id="support-email" class="input-style width-100" data-i18n-placeholder="views.settings.options.emailPlaceholder" autocomplete="email" data-modal-autofocus>
                <div id="support-email-error" class="input-error-msg"></div>
            </div>
            <div class="form-group flex-column-gap-5">
                <label for="support-desc" id="support-desc-label" class="input-label" data-i18n="views.settings.options.bugDescription"></label>
                <textarea id="support-desc" class="input-style width-100" maxlength="1000" rows="4" data-i18n-placeholder="views.settings.options.bugDescPlaceholder"></textarea>
                <div class="textarea-footer justify-between align-center">
                    <span id="support-desc-error" class="input-error-msg"></span>
                    <span id="support-char-count" class="char-count">0/1000</span>
                </div>
            </div>
            <div id="support-attach-group" class="form-group">
                <label class="checkbox-group">
                    <span class="checkbox-control">
                        <input type="checkbox" id="support-attach-checkbox" checked>
                        <clashcalc-assets-svg name="check-simple" class="checkbox-icon" width="14" height="14" aria-hidden="true"></clashcalc-assets-svg>
                    </span>
                    <span class="checkbox-label" data-i18n="views.settings.options.userDataAttachment"></span>
                </label>
                <p class="form-setting-text" data-i18n="views.settings.options.uuidAttachmentInfo"></p>
            </div>
            <div id="support-sw-troubleshoot-box" class="sw-troubleshoot-box">
                <div class="sw-troubleshoot-content">
                    <div class="sw-troubleshoot-text">
                        <span class="sw-troubleshoot-title" data-i18n="views.settings.bugReport.appNotUpdatingTitle"></span>
                        <span class="sw-troubleshoot-desc" data-i18n="views.settings.bugReport.swDesc"></span>
                    </div>
                    <button id="support-reset-sw-btn" type="button" class="support-sw-btn">
                        <clashcalc-assets-svg name="sync" height="14" width="14"></clashcalc-assets-svg>
                        <span data-i18n="views.settings.bugReport.forceUpdateLabel"></span>
                    </button>
                </div>
            </div>
            <div class="privacy-notice">
                <p id="support-privacy-bug" data-i18n="views.settings.bugReport.privacyInfo"></p>
                <p id="support-privacy-feedback" data-i18n="views.settings.feedback.privacyInfo" hidden></p>
            </div>
        </div>
        <div class="modal-actions">
            <button type="button" id="close-support-modal-btn" class="reject-button" data-i18n="actions.cancel"></button>
            <button type="button" id="submit-support-btn" class="accept-button" data-i18n="actions.submit"></button>
        </div>
    </div>
</dialog>
