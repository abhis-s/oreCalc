<dialog id="contact-modal" class="modal" aria-labelledby="contact-modal-title">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="contact-modal-title" data-i18n="views.settings.about.contact"></h2>
            <button type="button" id="close-contact-modal-btn" class="modal__close-btn" data-i18n-aria-label="actions.close">
                <clashcalc-assets-svg name="close"></clashcalc-assets-svg>
            </button>
        </div>
        <div class="modal-body">
            <p data-i18n="views.settings.about.contactInfo"></p>
        </div>
        <div class="modal-actions">
            <button type="button" id="close-contact-footer-btn" class="btn btn--secondary" data-i18n="actions.close"></button>
            <a href="mailto:support@clashcalc.com" id="contact-mail-btn" class="btn btn--primary" data-i18n="actions.openMailClient" data-modal-autofocus></a>
        </div>
    </div>
</dialog>
