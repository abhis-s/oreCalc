<dialog id="consent-modal" class="modal" aria-labelledby="consent-modal-title">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="consent-modal-title" data-i18n="legal.title"></h2>
            <button id="close-consent-modal-btn" class="close-button" data-i18n-aria-label="actions.close">
                <orecalc-assets-svg name="close"></orecalc-assets-svg>
            </button>
        </div>
        <div class="modal-body text-left">
            <p data-i18n="legal.description"></p>
            <div class="legal-links">
                <div id="consent-terms-row" class="consent-row">
                    <span><strong data-i18n="views.settings.termsOfUse"></strong> <span id="consent-terms-version-badge" class="consent-version-badge"></span></span>
                    <button id="consent-view-terms-btn" class="accept-button consent-view-btn" data-i18n="actions.view"></button>
                </div>
                <div id="consent-privacy-row" class="consent-row">
                    <span><strong data-i18n="views.settings.privacyPolicy"></strong> <span id="consent-privacy-version-badge" class="consent-version-badge"></span></span>
                    <button id="consent-view-privacy-btn" class="accept-button consent-view-btn" data-i18n="actions.view"></button>
                </div>
            </div>
            <p class="consent-statement" data-i18n="legal.consentStatement"></p>
        </div>
        <div class="modal-actions">
            <button id="confirm-consent-btn" class="accept-button consent-confirm-btn" data-i18n="actions.acceptAndContinue" data-modal-autofocus></button>
        </div>
    </div>
</dialog>
