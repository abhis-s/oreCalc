<dialog id="avatar-modal" class="modal" aria-labelledby="avatar-modal-title">
    <div class="modal-content avatar-modal-content modal-compact">
        <div class="modal-header">
            <h2 id="avatar-modal-title" data-i18n="auth.chooseAvatar"></h2>
            <button type="button" id="close-avatar-modal-btn" class="close-button" data-i18n-aria-label="actions.close">
                <clashcalc-assets-svg name="close"></clashcalc-assets-svg>
            </button>
        </div>
        <div class="modal-body">
            <div class="avatar-options-grid">
                <button type="button" class="avatar-option-btn" data-avatar="archer" aria-label="Archer" data-i18n-aria-label="entities.unitTypes.archer" data-modal-autofocus>
                    <clashcalc-assets-image src="assets/avatars/archer.png" alt=""></clashcalc-assets-image>
                </button>
                <button type="button" class="avatar-option-btn" data-avatar="builder" aria-label="Builder" data-i18n-aria-label="auth.avatars.builder">
                    <clashcalc-assets-image src="assets/avatars/builder.png" alt=""></clashcalc-assets-image>
                </button>
                <button type="button" class="avatar-option-btn" data-avatar="giant" aria-label="Giant" data-i18n-aria-label="auth.avatars.giant">
                    <clashcalc-assets-image src="assets/avatars/giant.png" alt=""></clashcalc-assets-image>
                </button>
                <button type="button" class="avatar-option-btn" data-avatar="goblin" aria-label="Goblin" data-i18n-aria-label="auth.avatars.goblin">
                    <clashcalc-assets-image src="assets/avatars/goblin.png" alt=""></clashcalc-assets-image>
                </button>
                <button type="button" class="avatar-option-btn" data-avatar="golem" aria-label="Golem" data-i18n-aria-label="auth.avatars.golem">
                    <clashcalc-assets-image src="assets/avatars/golem.png" alt=""></clashcalc-assets-image>
                </button>
                <button type="button" class="avatar-option-btn" data-avatar="hogRider" aria-label="Hog Rider" data-i18n-aria-label="entities.unitTypes.hogRider">
                    <clashcalc-assets-image src="assets/avatars/hogRider.png" alt=""></clashcalc-assets-image>
                </button>
                <button type="button" class="avatar-option-btn" data-avatar="hog" aria-label="Hog" data-i18n-aria-label="auth.avatars.hog">
                    <clashcalc-assets-image src="assets/avatars/hog.png" alt=""></clashcalc-assets-image>
                </button>
                <button type="button" class="avatar-option-btn" data-avatar="skeleton" aria-label="Skeleton" data-i18n-aria-label="auth.avatars.skeleton">
                    <clashcalc-assets-image src="assets/avatars/skeleton.png" alt=""></clashcalc-assets-image>
                </button>
            </div>
        </div>
    </div>
</dialog>
