<dialog id="welcome-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="welcome-modal-title">
    <div class="modal-content welcome-modal-content">
        <div class="welcome-header">
            <h1 id="welcome-modal-title" data-i18n="views.welcome.title"></h1>
            <p class="welcome-subtitle" data-i18n="views.welcome.subtitle"></p>
            <button id="welcome-header-skip-btn" class="welcome-header-skip-btn" data-i18n="views.welcome.skip" style="display: none;"></button>
        </div>

        <div class="welcome-carousel" id="welcome-carousel">
            <div class="welcome-page welcome-page-1" id="welcome-page-1">
                <div class="welcome-features">
                    <div class="welcome-feature-item">
                        <span class="feature-icon">
                            <orecalc-assets-svg name="bolt-planner" height="24" width="24"></orecalc-assets-svg>
                        </span>
                        <div class="feature-text">
                            <h2 data-i18n="views.welcome.feature1Title"></h2>
                            <p data-i18n="views.welcome.feature1Desc"></p>
                        </div>
                    </div>
                    <div class="welcome-feature-item">
                        <span class="feature-icon">
                            <orecalc-assets-svg name="sparkles" height="24" width="24"></orecalc-assets-svg>
                        </span>
                        <div class="feature-text">
                            <h2 data-i18n="views.welcome.feature2Title"></h2>
                            <p data-i18n="views.welcome.feature2Desc"></p>
                        </div>
                    </div>
                    <div class="welcome-feature-item">
                        <span class="feature-icon">
                            <orecalc-assets-svg name="sliders" height="24" width="24"></orecalc-assets-svg>
                        </span>
                        <div class="feature-text">
                            <h2 data-i18n="views.welcome.feature3Title"></h2>
                            <p data-i18n="views.welcome.feature3Desc"></p>
                        </div>
                    </div>
                </div>

                <div class="welcome-preferences">
                    <div class="preference-item">
                        <span class="preference-label">
                            <orecalc-assets-svg name="translate" height="18" width="18" class="pref-label-icon"></orecalc-assets-svg>
                            <span data-i18n="views.welcome.chooseLanguage"></span>
                        </span>
                        <div class="preference-select-wrapper language-select-wrapper">
                            <select class="preference-select language-select" id="welcome-language-select" aria-label="Select Language" data-modal-autofocus></select>
                            <span class="select-arrow"><orecalc-assets-svg name="chevron-down" height="14" width="14"></orecalc-assets-svg></span>
                        </div>
                    </div>
                    <div class="preference-item">
                        <span class="preference-label">
                            <orecalc-assets-svg name="routine" height="18" width="18" class="pref-label-icon"></orecalc-assets-svg>
                            <span data-i18n="views.welcome.chooseTheme"></span>
                        </span>
                        <div class="preference-switch theme-switch" data-active-index="0">
                            <div class="switch-pill"></div>
                            <button class="pref-btn" data-theme="dark">
                                <orecalc-assets-svg name="dark-mode" height="18" width="18"></orecalc-assets-svg>
                                <span data-i18n="views.settings.theme.dark"></span>
                            </button>
                            <button class="pref-btn" data-theme="light">
                                <orecalc-assets-svg name="light-mode" height="18" width="18"></orecalc-assets-svg>
                                <span data-i18n="views.settings.theme.light"></span>
                            </button>
                        </div>
                    </div>
                    <div class="preference-item">
                        <span class="preference-label">
                            <orecalc-assets-svg name="colors" height="18" width="18" class="pref-label-icon"></orecalc-assets-svg>
                            <span data-i18n="views.welcome.chooseAccent"></span>
                        </span>
                        <div class="welcome-accent-picker" id="welcome-accent-picker">
                            <button class="accent-swatch" data-color="blue" data-i18n-aria-label="colors.blue"></button>
                            <button class="accent-swatch" data-color="gold" data-i18n-aria-label="colors.gold"></button>
                            <button class="accent-swatch" data-color="purple" data-i18n-aria-label="colors.purple"></button>
                            <button class="accent-swatch" data-color="green" data-i18n-aria-label="colors.green"></button>
                            <button class="accent-swatch" data-color="red" data-i18n-aria-label="colors.red"></button>
                            <div class="random-swatch-wrapper">
                                <button class="accent-swatch" data-color="random" data-i18n-aria-label="colors.random" title="Random"></button>
                                <span class="random-label" data-i18n="colors.randomLabel"></span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="welcome-footer-links">
                    <span data-i18n="views.welcome.reportIssuePrompt"></span>
                    <a href="#" class="theme-link welcome-report-issue-link" data-i18n="views.welcome.reportIssueLink"></a>
                </div>
            </div>

            <div class="welcome-page welcome-page-2" id="welcome-page-2">
                <div class="player-name-input-container">
                    <label for="welcome-player-tag-input" data-i18n="views.welcome.enterTag"></label>
                    <div class="input-with-button">
                        <input type="text" id="welcome-player-tag-input" placeholder="#8PJYGUJC" maxlength="12" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false">
                        <button id="welcome-load-btn" class="welcome-inline-btn" data-i18n="views.welcome.loadProfile"></button>
                    </div>
                    <div id="welcome-player-tag-error" class="error-message"></div>
                </div>

                <div id="welcome-profiles-list-container" class="welcome-profiles-list-container" style="display: none;">
                    <span class="loaded-profiles-label" data-i18n="views.welcome.loadedProfiles"></span>
                    <div id="welcome-profiles-list" class="welcome-profiles-list">
                        <!-- DYNAMIC INSERTION: Compact player profile cards -->
                    </div>
                </div>

                <div id="welcome-profile-preview-container" class="welcome-profile-preview" style="display: none;">
                    <div class="welcome-anchor-arrow" id="welcome-profile-anchor-arrow"></div>
                    <div class="profile-card-tabs">
                        <button class="profile-tab-btn active" data-profile-tab="info" id="welcome-tab-btn-info"
                            data-i18n="views.welcome.profileTab"></button>
                        <button class="profile-tab-btn" data-profile-tab="equipment" id="welcome-tab-btn-equipment"
                            data-i18n="views.welcome.equipmentTab"></button>
                    </div>
                    <div class="profile-card-body">
                        <div class="profile-tab-content active" id="welcome-tab-content-info">
                            <div class="profile-header-main">
                                <div class="th-image-wrapper">
                                    <orecalc-assets-image id="welcome-profile-th-image" src="assets/th/th1.png"
                                        alt="Town Hall" size="standard"></orecalc-assets-image>
                                    <span class="th-level-badge" id="welcome-profile-th-level">16</span>
                                </div>
                                <div class="player-title-details">
                                    <h3 id="welcome-profile-name">Player Name</h3>
                                    <p id="welcome-profile-tag">#9L0V9G9C9</p>
                                </div>
                                <button id="welcome-profile-delete-btn" class="welcome-profile-delete-btn"
                                    aria-label="Delete Profile" title="Delete Profile">
                                    <orecalc-assets-svg name="trash" height="20" width="20"></orecalc-assets-svg>
                                </button>
                            </div>
                            <div class="profile-clan-details" id="welcome-profile-clan-section">
                                <orecalc-assets-image id="welcome-profile-clan-badge" class="clan-badge-img" src="" alt="Clan Badge"
                                    style="display: none;"></orecalc-assets-image>
                                <div class="clan-text-details">
                                    <span class="clan-label" data-i18n="views.welcome.clan"></span>
                                    <div class="clan-name-wrapper">
                                        <span class="clan-name" id="welcome-profile-clan-name">No Clan</span>
                                        <span class="clan-role" id="welcome-profile-clan-role" style="display: none;"></span>
                                    </div>
                                </div>
                            </div>
                            <div class="profile-stats-grid">
                                <div class="stat-box" id="welcome-profile-league-box">
                                    <span class="stat-icon" id="welcome-profile-league-icon-container">
                                        <orecalc-assets-image id="welcome-profile-league-icon" class="league-icon-img" src="" alt="League Icon" style="display: none;"></orecalc-assets-image>
                                        <orecalc-assets-svg id="welcome-profile-league-default-icon" name="star-badge"
                                            height="18" width="18"></orecalc-assets-svg>
                                    </span>
                                    <span class="stat-value league-name-value" id="welcome-profile-league-name" title="">-</span>
                                    <span class="stat-label" data-i18n="views.welcome.league"></span>
                                </div>
                                <div class="stat-box">
                                    <span class="stat-icon">
                                        <orecalc-assets-svg name="trophy" height="18" width="18"></orecalc-assets-svg>
                                    </span>
                                    <span class="stat-value" id="welcome-profile-trophies">0</span>
                                    <span class="stat-label" data-i18n="views.welcome.trophies"></span>
                                </div>
                                <div class="stat-box">
                                    <span class="stat-icon">
                                        <orecalc-assets-svg name="equipment-filled" height="18" width="18"></orecalc-assets-svg>
                                    </span>
                                    <span class="stat-value" id="welcome-profile-maxed-equip">0</span>
                                    <span class="stat-label" data-i18n="views.home.profile.maxedEquipment"></span>
                                </div>
                            </div>
                        </div>
                        <div class="profile-tab-content" id="welcome-tab-content-equipment" style="display: none;">
                            <div class="welcome-equip-progress-group">
                                <div class="group-header">
                                    <span class="group-title" data-i18n="views.welcome.commonEquip"></span>
                                    <span class="group-average" id="welcome-profile-common-avg">0%</span>
                                </div>
                                <div class="split-progress-container">
                                    <div class="progress-section shiny">
                                        <div class="section-header">
                                            <span data-i18n="entities.ores.shinyShort"></span>
                                            <span id="welcome-profile-common-shiny-pct">0%</span>
                                        </div>
                                        <div class="progress-track">
                                            <div class="progress-fill" id="welcome-profile-common-shiny-fill"></div>
                                        </div>
                                    </div>
                                    <div class="progress-section glowy">
                                        <div class="section-header">
                                            <span data-i18n="entities.ores.glowyShort"></span>
                                            <span id="welcome-profile-common-glowy-pct">0%</span>
                                        </div>
                                        <div class="progress-track">
                                            <div class="progress-fill" id="welcome-profile-common-glowy-fill"></div>
                                        </div>
                                    </div>
                                    <div class="progress-section starry disabled">
                                        <div class="section-header">
                                            <span data-i18n="entities.ores.starryShort"></span>
                                            <span>-</span>
                                        </div>
                                        <div class="progress-track">
                                            <div class="progress-fill"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="welcome-equip-progress-group">
                                <div class="group-header">
                                    <span class="group-title" data-i18n="views.welcome.epicEquip"></span>
                                    <span class="group-average" id="welcome-profile-epic-avg">0%</span>
                                </div>
                                <div class="split-progress-container">
                                    <div class="progress-section shiny">
                                        <div class="section-header">
                                            <span data-i18n="entities.ores.shinyShort"></span>
                                            <span id="welcome-profile-epic-shiny-pct">0%</span>
                                        </div>
                                        <div class="progress-track">
                                            <div class="progress-fill" id="welcome-profile-epic-shiny-fill"></div>
                                        </div>
                                    </div>
                                    <div class="progress-section glowy">
                                        <div class="section-header">
                                            <span data-i18n="entities.ores.glowyShort"></span>
                                            <span id="welcome-profile-epic-glowy-pct">0%</span>
                                        </div>
                                        <div class="progress-track">
                                            <div class="progress-fill" id="welcome-profile-epic-glowy-fill"></div>
                                        </div>
                                    </div>
                                    <div class="progress-section starry">
                                        <div class="section-header">
                                            <span data-i18n="entities.ores.starryShort"></span>
                                            <span id="welcome-profile-epic-starry-pct">0%</span>
                                        </div>
                                        <div class="progress-track">
                                            <div class="progress-fill" id="welcome-profile-epic-starry-fill"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div id="welcome-profile-heroes-equipment-list"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="welcome-page welcome-page-3" id="welcome-page-3">

                <div id="welcome-profiles-selection-view" class="welcome-profiles-selection-view">
                    <h3 data-i18n="views.welcome.selectProfileToSetup" class="welcome-section-title"></h3>
                    <p class="welcome-section-subtitle" data-i18n="views.welcome.selectProfileSubtitle"></p>

                    <div id="welcome-vertical-profiles-list" class="welcome-vertical-profiles-list">
                        <!-- DYNAMIC INSERTION: Vertical player profile cards -->
                    </div>
                </div>

            </div>

            <div class="welcome-page welcome-page-4" id="welcome-page-4">
                <h3 data-i18n="views.welcome.wizard.syncTitle" class="welcome-section-title"></h3>
                <p class="welcome-section-subtitle" data-i18n="views.welcome.wizard.syncDesc"></p>

                <div class="group-content welcome-cloud-sync-container" id="welcome-cloud-sync-container">
                    <div id="welcome-cloud-sync-guest-overlay" class="sync-disabled-overlay" style="display: none;">
                        <span class="sync-overlay-text" id="welcome-cloud-sync-overlay-text" data-i18n="views.welcome.cloudSyncPlayerTagRequired"></span>
                    </div>
                    <div class="welcome-quick-setting-item">
                        <div class="quick-setting-details">
                            <orecalc-assets-svg name="sync-cloud" height="24" width="24" class="quick-setting-icon"></orecalc-assets-svg>
                            <span class="quick-setting-title" data-i18n="views.welcome.quickSettings.cloudSync"></span>
                        </div>
                        <label class="switch">
                            <input type="checkbox" id="welcome-pref-cloud-sync" checked
                                data-i18n-aria-label="views.welcome.quickSettings.cloudSync">
                            <span class="slider round"></span>
                        </label>
                    </div>
                </div>

                <div class="group-content welcome-device-sync-section">
                    <div id="welcome-device-sync-overlay" class="sync-disabled-overlay" style="display: none;">
                        <orecalc-assets-svg name="warning" height="24" width="24" fill="var(--color-warning)"></orecalc-assets-svg>
                        <span class="sync-overlay-text sync-overlay-text--warning"
                            data-i18n="views.welcome.quickSettings.cloudSyncRequiredForDeviceSync"></span>
                    </div>

                    <div class="welcome-device-sync-content">
                        <div class="sync-title-row">
                            <orecalc-assets-svg name="sync" height="18" width="18"></orecalc-assets-svg>
                            <span class="sync-section-title" data-i18n="views.settings.deviceSyncTitle"></span>
                        </div>
                        <p class="sync-section-desc" data-i18n="views.settings.deviceSyncDesc"></p>

                        <div class="sync-menus-container">
                            <div class="welcome-sync-details-wrapper" id="welcome-your-sync-code-wrapper">
                                <div id="welcome-sync-qr-guest-overlay" class="sync-disabled-overlay" style="display: none;">
                                    <span class="sync-overlay-text" data-i18n="views.welcome.cloudSyncPlayerTagRequired"></span>
                                </div>
                                <details class="welcome-sync-details" id="welcome-your-sync-code-details" open>
                                    <summary class="welcome-sync-summary">
                                        <span class="sync-summary-title" data-i18n="views.settings.yourSyncCode"></span>
                                        <span class="chevron"><orecalc-assets-svg name="chevron-down" height="14" width="14"></orecalc-assets-svg></span>
                                    </summary>
                                    <div class="welcome-sync-details-content">
                                        <div class="sync-menu-content">
                                            <div class="sync-user-id-row">
                                                <div id="welcome-sync-user-id" class="calculated id-child-fields qr-user-id" data-i18n-title="actions.clickToCopy"></div>
                                                <button id="welcome-sync-copy-btn" class="accept-button">Copy</button>
                                            </div>

                                            <div class="sync-qr-wrapper">
                                                <span class="sync-qr-instruction" data-i18n="player.qrDisplayInstruction"></span>
                                                <div id="welcome-sync-qr-container"></div>
                                            </div>
                                        </div>
                                    </div>
                                </details>
                            </div>

                            <details class="welcome-sync-details" id="welcome-link-device-details">
                                <summary class="welcome-sync-summary">
                                    <span class="sync-summary-title" data-i18n="views.settings.linkDevice"></span>
                                    <span class="chevron"><orecalc-assets-svg name="chevron-down" height="14" width="14"></orecalc-assets-svg></span>
                                </summary>
                                <div class="welcome-sync-details-content">
                                    <div class="sync-menu-content">
                                        <p class="sync-scan-instruction" data-i18n="player.qrScanInstruction"></p>
                                        <div class="sync-user-id-row">
                                            <input type="text" id="welcome-sync-input"
                                                data-i18n-placeholder="views.settings.placeholderSyncCode" maxlength="36"
                                                spellcheck="false">
                                            <button id="welcome-sync-link-btn" class="accept-button">Link</button>
                                        </div>
                                        <div id="welcome-sync-status" class="status-message sync-status-msg" style="display: none;"></div>
                                    </div>
                                </div>
                            </details>
                        </div>
                    </div>
                </div>

                <div class="welcome-consent-box">
                    <p data-i18n="views.welcome.disclaimer"></p>
                </div>

                <div class="welcome-footer-links">
                    <span data-i18n="views.welcome.reportIssuePrompt"></span>
                    <a href="#" class="theme-link welcome-report-issue-link" data-i18n="views.welcome.reportIssueLink"></a>
                </div>
            </div>

        </div>

        <!-- include: partials/modals/welcome/setup-wizard-view.html -->

        <div class="welcome-dots" id="welcome-dots">
            <span class="welcome-dot active" data-page="1"></span>
            <span class="welcome-dot" data-page="2"></span>
            <span class="welcome-dot" data-page="3"></span>
            <span class="welcome-dot" data-page="4"></span>
        </div>

        <!-- DYNAMIC INSERTION: Page action buttons -->
        <div class="modal-actions welcome-actions" id="welcome-main-actions">
            <button id="welcome-guest-btn" class="btn-primary" style="display: none;"
                data-i18n="views.welcome.guest"></button>
            <button id="welcome-continue-btn" class="btn-primary" data-i18n="views.welcome.continue"></button>
            <button id="welcome-submit-btn" class="btn-primary" style="display: none;"
                data-i18n="views.welcome.getStarted"></button>
            <button id="welcome-wizard-next-btn" class="btn-primary" style="display: none;"
                data-i18n="views.welcome.next"></button>
            <button id="welcome-sync-device-start-btn" class="btn-secondary"
                data-i18n="views.welcome.linkToAnotherDevice"></button>
            <button id="welcome-back-btn" class="btn-secondary" style="display: none;"
                data-i18n="views.welcome.back"></button>
            <button id="welcome-wizard-back-btn" class="btn-secondary" style="display: none;"
                data-i18n="views.welcome.back"></button>
        </div>

    </div>
</dialog>
