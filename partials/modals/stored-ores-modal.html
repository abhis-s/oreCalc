<dialog id="stored-ores-modal" class="modal modal-top" aria-labelledby="stored-ores-modal-title">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="stored-ores-modal-title" data-i18n="views.income.ores.storedTitle"></h2>
            <button id="close-stored-ores-modal-btn" class="close-button" data-i18n-aria-label="actions.close">
                <orecalc-assets-svg name="close"></orecalc-assets-svg>
            </button>
        </div>
        <div class="modal-body flex-column-gap-15">
            <p class="stored-ores-prompt" data-i18n="views.income.ores.modalStoredOresPrompt"></p>
            <div class="custom-chip-ores-row">
                <div class="custom-chip-ore-input-group">
                    <div class="popover-wrapper">
                        <input type="number" id="modal-stored-ore-shiny" min="0" max="50000" step="100" maxlength="5" value="0" data-modal-autofocus>
                    </div>
                    <label for="modal-stored-ore-shiny"><orecalc-assets-image src="assets/shiny_ore.png" alt="Shiny Ore" class="ore-image"></orecalc-assets-image></label>
                </div>
                <div class="custom-chip-ore-input-group">
                    <div class="popover-wrapper">
                        <input type="number" id="modal-stored-ore-glowy" min="0" max="5000" step="10" maxlength="4" value="0">
                    </div>
                    <label for="modal-stored-ore-glowy"><orecalc-assets-image src="assets/glowy_ore.png" alt="Glowy Ore" class="ore-image"></orecalc-assets-image></label>
                </div>
                <div class="custom-chip-ore-input-group">
                    <div class="popover-wrapper">
                        <input type="number" id="modal-stored-ore-starry" min="0" max="1000" step="1" maxlength="4" value="0">
                    </div>
                    <label for="modal-stored-ore-starry"><orecalc-assets-image src="assets/starry_ore.png" alt="Starry Ore" class="ore-image"></orecalc-assets-image></label>
                </div>
            </div>

            <div class="input-group-flex push-top-10">
                <div class="field-descriptor-group">
                    <div class="flex-center-gap-8">
                        <label for="modal-stored-ore-auto-predict" data-i18n="views.income.ores.autoPredictTitle"></label>
                        <span class="coming-soon-badge" data-i18n="views.settings.badges.comingSoon"></span>
                    </div>
                    <p class="form-setting-text" data-i18n="views.income.ores.autoPredictDesc"></p>
                </div>
                <div class="switch is-disabled">
                    <input type="checkbox" id="modal-stored-ore-auto-predict" disabled>
                    <span class="slider round"></span>
                </div>
            </div>

            <div class="input-group-flex push-top-5">
                <div class="field-descriptor-group">
                    <label for="modal-stored-ore-dont-ask" data-i18n="views.income.ores.dontAskTwoMonths"></label>
                    <p class="form-setting-text" data-i18n="views.income.ores.dontAskTwoMonthsDesc"></p>
                </div>
                <div class="switch">
                    <input type="checkbox" id="modal-stored-ore-dont-ask">
                    <span class="slider round"></span>
                </div>
            </div>
        </div>
        <div class="modal-actions">
            <button id="cancel-stored-ores-modal-btn" class="reject-button" data-i18n="actions.cancel"></button>
            <button id="save-stored-ores-modal-btn" class="accept-button" data-i18n="actions.save"></button>
        </div>
    </div>
</dialog>
