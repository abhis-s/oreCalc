<div class="app-account-wrapper">
    <button type="button" id="header-account-btn" class="header-account-btn"
        aria-haspopup="dialog" aria-expanded="false" aria-controls="app-account-popover"
        data-i18n-title="auth.account" aria-label="Account" data-i18n-aria-label="auth.account">
        <span class="header-account-icon-wrapper fill-current" id="header-account-icon-wrapper">
            <orecalc-assets-svg name="user" id="header-account-icon"></orecalc-assets-svg>
        </span>
        <orecalc-assets-image id="header-account-avatar-img" class="header-account-avatar-img is-hidden" src="assets/avatars/archer.png" alt="Avatar" data-i18n-alt="auth.avatarAlt"></orecalc-assets-image>
    </button>

    <div id="app-account-popover" class="app-account-popover" role="dialog" aria-modal="false"
        aria-label="Account and Settings" data-i18n-aria-label="views.settings.cards.accountAndSync" hidden>

        <div id="account-popover-auth-section" class="account-popover-section is-hidden">
            <div class="account-user-profile-card">
                <button type="button" id="account-popover-avatar-btn" class="account-user-profile-avatar" aria-label="Change Avatar" data-i18n-aria-label="auth.changeAvatar">
                    <orecalc-assets-image id="account-popover-avatar-img" src="assets/avatars/archer.png" alt="Avatar" data-i18n-alt="auth.avatarAlt"></orecalc-assets-image>
                </button>
                <div class="account-user-profile-details">
                    <span id="account-popover-username" class="account-user-profile-name"></span>
                    <span class="account-user-profile-status" data-i18n="auth.signedInStatus"></span>
                </div>
                <div class="account-user-profile-actions">
                    <button type="button" id="account-popover-logout-btn" class="animated-btn btn-danger-action task-btn">
                        <span class="animated-btn-icon-wrapper fill-current">
                            <orecalc-assets-svg name="logout"></orecalc-assets-svg>
                        </span>
                        <span class="animated-btn-text" data-i18n="auth.signOut"></span>
                    </button>
                </div>
            </div>

            <div class="account-popover-subactions">
                <div class="account-popover-item">
                    <div class="field-descriptor-group">
                        <div class="settings-item-label-wrapper">
                            <span class="settings-item-label" data-i18n="auth.passkeys"></span>
                        </div>
                        <p class="form-setting-text" data-i18n="auth.passkeysDesc"></p>
                    </div>
                    <button type="button" id="account-popover-passkeys-btn" class="animated-btn btn-secondary task-btn">
                        <span class="animated-btn-icon-wrapper fill-current">
                            <orecalc-assets-svg name="passkey"></orecalc-assets-svg>
                        </span>
                        <span class="animated-btn-text" data-i18n="actions.manage"></span>
                    </button>
                </div>

                <div class="account-popover-item">
                    <div class="field-descriptor-group">
                        <div class="settings-item-label-wrapper">
                            <span class="settings-item-label" data-i18n="views.settings.dataManagement.title"></span>
                        </div>
                        <p class="form-setting-text" data-i18n="views.settings.dataManagement.cardDesc"></p>
                    </div>
                    <button type="button" id="account-popover-data-btn" class="animated-btn btn-secondary task-btn">
                        <span class="animated-btn-icon-wrapper fill-current">
                            <orecalc-assets-svg name="manage-account"></orecalc-assets-svg>
                        </span>
                        <span class="animated-btn-text" data-i18n="actions.manage"></span>
                    </button>
                </div>
            </div>
        </div>

        <div id="account-popover-guest-section" class="account-popover-section">
            <div class="account-popover-guest-card">
                <div class="account-popover-guest-content">
                    <div class="account-popover-guest-icon-wrapper">
                        <orecalc-assets-svg name="user" class="account-popover-guest-icon"></orecalc-assets-svg>
                    </div>
                    <div class="account-popover-guest-details">
                        <span class="account-popover-guest-title" data-i18n="auth.account"></span>
                        <p class="form-setting-text" data-i18n="auth.accountCardDesc"></p>
                    </div>
                </div>
                <button type="button" id="account-popover-signin-btn" class="animated-btn btn-accent task-btn">
                    <span class="animated-btn-icon-wrapper fill-dark">
                        <orecalc-assets-svg name="user"></orecalc-assets-svg>
                    </span>
                    <span class="animated-btn-text" data-i18n="auth.signIn"></span>
                </button>
            </div>

            <div class="account-popover-subactions">
                <div class="account-popover-item">
                    <div class="field-descriptor-group">
                        <div class="settings-item-label-wrapper">
                            <span class="settings-item-label" data-i18n="views.settings.options.deviceSync"></span>
                        </div>
                        <p class="form-setting-text" data-i18n="views.settings.cloudSync.deviceInfo"></p>
                    </div>
                    <button type="button" id="account-popover-guest-sync-btn" class="animated-btn btn-secondary task-btn">
                        <span class="animated-btn-icon-wrapper fill-current">
                            <orecalc-assets-svg name="sync"></orecalc-assets-svg>
                        </span>
                        <span class="animated-btn-text" data-i18n="actions.sync"></span>
                    </button>
                </div>

                <div class="account-popover-item">
                    <div class="field-descriptor-group">
                        <div class="settings-item-label-wrapper">
                            <span class="settings-item-label" data-i18n="views.settings.dataManagement.title"></span>
                        </div>
                        <p class="form-setting-text" data-i18n="views.settings.dataManagement.cardDesc"></p>
                    </div>
                    <button type="button" id="account-popover-guest-data-btn" class="animated-btn btn-secondary task-btn">
                        <span class="animated-btn-icon-wrapper fill-current">
                            <orecalc-assets-svg name="manage-account"></orecalc-assets-svg>
                        </span>
                        <span class="animated-btn-text" data-i18n="actions.manage"></span>
                    </button>
                </div>
            </div>
        </div>

        <hr class="account-popover-divider">

        <details id="account-popover-prefs-details" class="account-popover-preferences">
            <summary class="account-popover-prefs-summary">
                <span class="account-popover-prefs-title">
                    <orecalc-assets-svg name="settings-filled" width="16" height="16" class="pref-label-icon"></orecalc-assets-svg>
                    <span data-i18n="nav.settings"></span>
                </span>
                <orecalc-assets-svg name="chevron-down" width="14" height="14" class="account-popover-prefs-chevron"></orecalc-assets-svg>
            </summary>
            <div class="welcome-preferences app-preferences push-top-10">
                <div class="preference-item">
                    <span class="preference-label">
                        <orecalc-assets-svg name="translate" height="18" width="18" class="pref-label-icon"></orecalc-assets-svg>
                        <span data-i18n="views.settings.options.language"></span>
                    </span>
                    <div class="preference-select-wrapper language-select-wrapper">
                        <select class="preference-select language-select" id="app-language-select" aria-label="Select Language" data-i18n-aria-label="views.settings.options.language">
                            <!-- DYNAMIC INSERTION: Language select options -->
                        </select>
                        <span class="select-arrow"><orecalc-assets-svg name="chevron-down" height="14" width="14"></orecalc-assets-svg></span>
                    </div>
                </div>

                <div class="preference-item">
                    <label for="app-theme-toggle" class="preference-label">
                        <orecalc-assets-svg name="routine" height="18" width="18" class="pref-label-icon"></orecalc-assets-svg>
                        <span id="app-theme-label" data-i18n="views.settings.options.themeLight"></span>
                    </label>
                    <div class="switch theme-switch">
                        <input type="checkbox" id="app-theme-toggle">
                        <span class="slider round">
                            <orecalc-assets-svg name="dark-mode" class="switch-icon icon-dark"></orecalc-assets-svg>
                            <orecalc-assets-svg name="light-mode" class="switch-icon icon-light"></orecalc-assets-svg>
                        </span>
                    </div>
                </div>

                <div class="preference-item">
                    <span class="preference-label">
                        <orecalc-assets-svg name="palette" height="18" width="18" class="pref-label-icon"></orecalc-assets-svg>
                        <span data-i18n="views.settings.options.accentColor"></span>
                    </span>
                    <div class="welcome-accent-picker" id="app-accent-picker">
                        <button type="button" class="accent-swatch" data-color="blue" data-i18n-aria-label="colors.blue"></button>
                        <button type="button" class="accent-swatch" data-color="gold" data-i18n-aria-label="colors.gold"></button>
                        <button type="button" class="accent-swatch" data-color="purple" data-i18n-aria-label="colors.purple"></button>
                        <button type="button" class="accent-swatch" data-color="green" data-i18n-aria-label="colors.green"></button>
                        <button type="button" class="accent-swatch" data-color="red" data-i18n-aria-label="colors.red"></button>
                        <button type="button" class="accent-swatch" data-color="random" data-i18n-aria-label="colors.random" title="Random" data-i18n-title="colors.random"></button>
                    </div>
                </div>
            </div>
        </details>
    </div>
</div>
