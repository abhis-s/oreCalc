    <script>
        (function() {
            try {
                var isLight = false;
                var raw = localStorage.getItem('clashCalc_appSettings') || localStorage.getItem('oreCalc_appSettings') || localStorage.getItem('orecalc_state');
                if (raw) {
                    var parsed = JSON.parse(raw);
                    isLight = Boolean(parsed && (parsed.theme === 'light' || (parsed.settings && parsed.settings.theme === 'light')));
                    var accent = parsed && (parsed.accentColor || (parsed.settings && parsed.settings.accentColor));
                    if (accent) {
                        document.documentElement.setAttribute('data-accent', accent);
                    }
                }

                // Immediate synchronous PWA startup route resolution (eliminates hub flash on cold launch)
                var isStandalone = Boolean(
                    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
                    (window.navigator && window.navigator.standalone) ||
                    /[?&]source=pwa\b/.test(window.location.search)
                );
                var isColdLaunch = !sessionStorage.getItem('clashCalc_sessionLaunched');
                var path = window.location.pathname;
                var isHubRoute = /^\/(?:(?:de|tr|zh)\/)?(?:index\.html)?$/.test(path);

                if (isStandalone && isColdLaunch && isHubRoute) {
                    var startup = parsed && (parsed.startupRoute || (parsed.settings && parsed.settings.startupRoute));
                    if (startup && startup !== '/') {
                        sessionStorage.setItem('clashCalc_sessionLaunched', 'true');
                        var langMatch = path.match(/^\/(de|tr|zh)(?:\/|$)/);
                        var langPrefix = langMatch ? '/' + langMatch[1] : '';
                        window.location.replace(langPrefix + startup);
                        return;
                    }
                }
                var bg = isLight ? '#f8f9fa' : '#121212';
                var m = document.querySelector('meta[name="theme-color"]:not([media])');
                if (m) m.setAttribute('content', bg);
                document.documentElement.style.backgroundColor = bg;
                document.documentElement.style.colorScheme = isLight ? 'light' : 'dark';
                if (isLight) {
                    document.documentElement.classList.add('light-mode');
                } else {
                    document.documentElement.classList.add('dark-mode');
                }
                var rawTags = localStorage.getItem('clashCalc_playerTags') || localStorage.getItem('oreCalc_playerTags');
                var hasValidTag = false;
                if (rawTags && rawTags !== '[]' && rawTags !== '["DEFAULT0"]') {
                    try {
                        var parsedTags = JSON.parse(rawTags);
                        hasValidTag = Array.isArray(parsedTags) && parsedTags.some(function(t) { return t && t !== 'DEFAULT0'; });
                    } catch (_) {}
                }
                if (/[?&]tag=/.test(window.location.search) || hasValidTag) {
                    document.documentElement.classList.add('has-player');
                }
            } catch (e) {}
        })();
    </script>
