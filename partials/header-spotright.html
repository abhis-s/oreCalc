<button type="button" id="header-spotright-btn" class="header-spotright-btn"
    aria-haspopup="dialog" aria-expanded="false" aria-controls="spotright-dialog"
    aria-label="Search & Command Palette" data-i18n-aria-label="views.spotright.searchTrigger"
    title="Search & Command Palette (⌘K)" data-i18n-title="views.spotright.searchTrigger">
    <clashcalc-assets-svg name="travel-explore" class="header-spotright-icon"></clashcalc-assets-svg>
    <span class="header-spotright-label" data-i18n="actions.search">Search</span>
    <div class="header-spotright-keys" aria-hidden="true">
        <kbd class="header-spotright-key" id="header-spotright-mod-key"><clashcalc-assets-svg name="keyboard-command" class="header-spotright-key-svg"></clashcalc-assets-svg></kbd>
        <kbd class="header-spotright-key header-spotright-key--letter">K</kbd>
    </div>
</button>
